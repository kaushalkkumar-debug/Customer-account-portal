# Struts message resources — looked up by <html:errors/> on login.jsp via
# the key set in struts-config.xml's <message-resources parameter=...>.
# Without this bundle, ANY validation/login failure throws
# "Cannot find message resources under key org.apache.struts.action.MESSAGE"
# instead of rendering the error — caught by actually running the app and
# submitting a wrong password, not by the unit tests (which call the EJB
# layer directly and never go through the Struts error-rendering path).

error.username.required=Username is required.
error.password.required=Password is required.
error.login.invalid=Invalid username or password.
